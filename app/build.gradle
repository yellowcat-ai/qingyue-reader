plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qingyue.reader'
    compileSdk 34

    defaultConfig {
        applicationId "com.qingyue.reader"
        minSdk 26
        targetSdk 34
        versionCode 40
        versionName "1.37.0"
        // 离线 native 语音引擎（sherpa-onnx）已从 App 移除：它在部分机型上加载即崩溃，
        // 且需要 78MB 模型包。现在只有在线音色 + 系统语音两条路，均不含 native 库。
    }

    // 语音模型约 78MB，不再打进 APK（100MB 的包在小米等机型上会「解析软件包失败」）。
    // 改为运行时下载，这里确保 assets 里不再包含 tts 目录。
    androidResources {
        noCompress += ['onnx', 'bin', 'zip']
        ignoreAssetsPattern = '!tts'
    }

    packagingOptions {
        // so 压缩存储，APK 体积从 ~100MB 降到十几 MB
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.webkit:webkit:1.8.0'
    // 在线音色（微软 Edge TTS，WebSocket 流式合成）
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

// 统一 kotlin-stdlib 版本，避免 jdk7/jdk8 旧包重复类导致构建失败
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
